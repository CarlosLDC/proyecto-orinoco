[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-orinoco-backend"
version = "1.0.0"
description = "Predicción Hidrométrica del Río Orinoco (AutoARIMA, SARIMAX, LSTM, Bi-LSTM, Transformer, TimesFM)"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
